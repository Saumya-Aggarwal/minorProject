- id: find-fit-advice-without-chart
  source: reply 579 (22 Sep); "a size M or L would fit well" from nothing
  tags: [size, advice]
  prelude:
    - say: haldi outfit for my sister around 5k
      model:
        - send_reply: {message: "Haldi picks for your sister.", product_ids: [EW076, EW055, EW056, EW068]}
    - say: "1"
  turns:
    - say: my sis is 5'8 which size would fit her well
      expect:
        cart_unchanged: true
      judge: Does not claim a particular size will fit from her height alone; offers the sizes the item comes in, or asks for a measurement such as bust or waist.

