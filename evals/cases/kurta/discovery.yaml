# Finding something: who it is for, the function, the budget, colour, category.
# When the words do not say who will wear it, the assistant asks (CLAUDE.md, Assistant).

- id: find-haldi-brother
  source: reply 124 (21 Sep), rated good by the owner
  tags: [discovery, wearer]
  turns:
    - say: i would like to buy haldi outfits for my brother
      expect:
        shown_fit: {gender: Men}
        profile_gender: null
        cart_unchanged: true

- id: find-haldi-brother-budget
  source: reply 125 (21 Sep); owner rated EW045, EW040, EW001 good and EW047 wrong
  tags: [discovery, budget]
  prelude:
    - say: i would like to buy haldi outfits for my brother
      model:
        - send_reply: {message: "Lovely! What budget should I keep to?"}
  turns:
    - say: around 7k
      expect:
        shows: true
        shown_fit: {gender: Men, max_price: 7000}
        shows_any: [EW045, EW033, EW011]
        profile_gender: null

