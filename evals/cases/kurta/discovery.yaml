- id: find-not-stocked
  tags: [discovery, category]
  turns:
    - say: do you have jeans?
      expect:
        reply_has: ["(?:don't|do not|no|not)\\b.*(?:jeans|stock|carry|sell)|only|ethnic"]

- id: find-groom-not-guest
  source: plan.md P2 evidence ("groom vs guest")
  tags: [discovery, occasion]
  given:
    profile: {gender: Men}
  turns:
    - say: what should i wear to my own wedding
      note: Asking which function (ceremony, reception...) is fair; asking who will wear it is not
      expect:
        shown_fit: {gender: Men, occasion: [groom, wedding]}
        reply_lacks: ["who (?:is|will|are)", "for whom"]
