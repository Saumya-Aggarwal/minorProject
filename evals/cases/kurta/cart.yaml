- id: cart-free-size-gift
  source: 'replies 774-775 (22 Sep); invented "Sizes: S, M, L, XL" for a clutch, then "in Medium"'
  tags: [cart, size]
  prelude:
    - say: accessories for my wife for a wedding, around 10k
      model:
        - send_reply: {message: "Wedding accessories for her.", product_ids: [EW080, EW079, EW084, EW077]}
  turns:
    - say: would 1 be a good gift for my wife?
      expect:
        cart_unchanged: true
    - say: i think medium would look good on her
      expect:
        cart_has: [{product: EW080}]

- id: cart-add-in-size-after-pick
  source: reply 580 (22 Sep); the cart was shown twice
  tags: [cart, size]
  prelude:
    - say: haldi outfit for my sister around 5k
      model:
        - send_reply: {message: "Haldi picks for your sister.", product_ids: [EW076, EW055, EW056, EW068]}
    - say: "1"
  turns:
    - say: pls add L to my cart
