- id: reorder-old-order
  source: reply 975 (22 Sep); answered "Added the." with one product
  tags: [reorder]
  given:
    orders:
      - {items: [{product: EW080, size: Free Size}], days_ago: 3}
      - {items: [{product: EW045, size: XXL}], days_ago: 20}
