services:
  postgres:
    # Postgres 15 with the pgvector extension: product vectors live next to the
    # products (plan.md P1). Debian-based, unlike the old postgres:15-alpine, so
    # it has its own volume: the two sort text differently, and indexes built by
    # one are not valid under the other. Moving data = pg_dump, then pg_restore.
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsapp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  pgvector_data:
  chroma_data: