<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kurta & Co.{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col">
  <header class="border-b border-stone-200 bg-white">
    <nav class="max-w-5xl mx-auto px-4 py-4 flex items-center gap-4">
      <a href="/" class="font-semibold text-lg tracking-tight">Kurta&nbsp;&amp;&nbsp;Co.</a>
      <span class="text-xs text-stone-400 hidden sm:inline">Ethnic wear</span>
      <div class="ml-auto flex items-center gap-4 text-sm">
        {% if user %}
          <a href="/account" class="hover:underline">{{ user.display_name or user.email }}</a>
          <a href="/logout" class="text-stone-500 hover:underline">Sign out</a>
        {% else %}
          <a href="/login" class="hover:underline">Sign in</a>
          <a href="/signup" class="bg-stone-900 text-white px-3 py-1.5 rounded-md hover:bg-stone-700">Sign up</a>
        {% endif %}
      </div>
    </nav>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-stone-200 py-6 text-center text-xs text-stone-400">
    Minor project demo &middot; WhatsApp shopping assistant
  </footer>
</body>
</html>
