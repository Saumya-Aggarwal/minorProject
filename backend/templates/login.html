{% extends "base.html" %}
{% import "partials/auth_layout.html" as auth %}
{% block title %}Sign in — Kurta &amp; Co.{% endblock %}
{% block content %}
{% call auth.frame() %}
<p class="eyebrow">Welcome back</p>
<h1 class="display mt-3 text-4xl">Sign in</h1>
<p class="mt-2 text-sm text-muted">New here? <a href="/signup{{ '?next=' ~ (next | urlencode) if next and next != '/account' else '' }}" class="link">Create an account</a></p>

{% if error %}
<p class="mt-6 border-l-2 border-maroon bg-maroon-tint px-4 py-3 text-sm text-maroon" role="alert">{{ error }}</p>
{% endif %}

<form method="post" action="/login" class="mt-8 space-y-5">
  <input type="hidden" name="next" value="{{ next }}">
  <div>
    <label for="email" class="label">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email" value="{{ email or '' }}" class="field">
  </div>
  <div>
    <label for="password" class="label">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" class="field">
  </div>
  <button type="submit" class="btn-primary w-full">Sign in</button>
</form>
{% endcall %}
{% endblock %}
