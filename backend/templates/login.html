{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white border border-stone-200 rounded-lg p-6">
  <h1 class="text-xl font-semibold mb-4">Sign in</h1>

  {% if error %}
  <p class="bg-red-50 text-red-700 text-sm rounded px-3 py-2 mb-4">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm text-stone-600 mb-1" for="email">Email</label>
      <input id="email" name="email" type="email" required value="{{ email or '' }}"
             class="w-full border border-stone-300 rounded-md px-3 py-2">
    </div>
    <div>
      <label class="block text-sm text-stone-600 mb-1" for="password">Password</label>
      <input id="password" name="password" type="password" required
             class="w-full border border-stone-300 rounded-md px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-stone-900 text-white py-2.5 rounded-md hover:bg-stone-700">
      Sign in
    </button>
  </form>

  <p class="text-sm text-stone-500 mt-4">
    No account? <a href="/signup" class="underline">Sign up</a>
  </p>
</div>
{% endblock %}
